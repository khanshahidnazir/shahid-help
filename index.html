<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahid | Systems & Analytics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 48px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 520px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 { font-size: 2rem; margin-bottom: 8px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; font-size: 1.05rem; margin-bottom: 20px; }
        p.bio { color: #cbd5e1; line-height: 1.6; font-size: 0.95rem; margin-bottom: 28px; }
        .links a {
            display: inline-block;
            margin: 6px;
            padding: 10px 22px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .links a:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Shahid Khan</h1>
        <p class="subtitle">Infrastructure, Security & Data Analytics</p>
        <p class="bio">
            Designing secure network infrastructure, automated data pipelines, and scalable reporting environments.
        </p>
        <div class="links">
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://github.com/khanshahidnazir" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
